# /etc/nginx/conf.d/bitcom-api.conf
# 기존 nginx 에 추가: /bitcom/api/ 요청만 백엔드 컨테이너(호스트 8000)로 넘긴다.
# 이미 server 블록이 있으면 아래 location 블록만 그 server 안에 복사해도 된다.

upstream bitcom_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080;                 # Cloudflare Pages Function(BACKEND_ORIGIN)이 붙는 포트. 80 을 쓰려면 바꾸고 기존 server 와 충돌 확인
    server_name _;

    # 백엔드 API 외 경로는 없음
    location = / { return 404; }

    location /bitcom/api/ {
        proxy_pass http://bitcom_backend;      # 경로 그대로 전달 (/bitcom/api/... 유지)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 외부 Background Check API 가 최대 ~35s 걸릴 수 있어 여유 있게
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        client_max_body_size 1m;
    }
}
